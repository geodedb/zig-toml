---
# GitLab CI/CD Pipeline for toml
# SPDX-License-Identifier: Apache-2.0

default:
  tags:
    - company
    - linux
    - x86

include:
  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]

  # Code quality
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]

  # SBOM
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]

  # Release
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.55.8
    inputs:
      tags: ["company", "linux", "x86"]
      # Create the GitLab Release with CI_JOB_TOKEN: the group GITLAB_TOKEN
      # lacks api scope, so the default glab path fails with 403 (SONNY-2447).
      release_auth: job_token
  - component: gitlab.com/devnw/ci-catalog/zig-version-tag-check@v1.55.6
    inputs:
      tags: ["company", "linux", "x86"]

variables:
  ZIG_VERSION: "0.16.0"
  # Pinned tag of github.com/toml-lang/toml-test. Bump deliberately; do
  # not use @latest -- upstream corpus changes would turn CI red without
  # a local commit. See docs/superpowers/plans/2026-04-18-13-toml-test-ci-differential.md.
  TOML_TEST_VERSION: "v1.5.0"
  # Coverage floor.
  # Bumped deliberately as tests are added. The floor sits two below
  # the live step count so normal flake does not mask a real drop.
  COVERAGE_TEST_FLOOR: "8"

stages:
  - lint
  - build
  - test
  - fuzz
  - bench
  - security
  - sbom
  - release

# Zig installation template (SEC-R6-02: SHA-256 verified via ziglang.org index)
.install-zig: &install-zig
  - apt-get update && apt-get install -y curl xz-utils python3
  - |
    if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
      ARCH=$(uname -m)
      case "$ARCH" in
        x86_64)  ZIG_ARCH="x86_64" ;;
        aarch64) ZIG_ARCH="aarch64" ;;
        arm64)   ZIG_ARCH="aarch64" ;;
        *)       echo "Unsupported architecture: $ARCH"; exit 1 ;;
      esac
      MAJOR=$(echo "$ZIG_VERSION" | cut -d. -f1)
      MINOR=$(echo "$ZIG_VERSION" | cut -d. -f2)
      if [ "$MAJOR" -eq 0 ] && [ "$MINOR" -lt 15 ]; then
        ARCHIVE_NAME="zig-linux-${ZIG_ARCH}-${ZIG_VERSION}"
      else
        ARCHIVE_NAME="zig-${ZIG_ARCH}-linux-${ZIG_VERSION}"
      fi
      TARBALL="${ARCHIVE_NAME}.tar.xz"
      INDEX_FILE=$(mktemp)
      curl -fsSL "https://ziglang.org/download/index.json" -o "${INDEX_FILE}"
      EXPECTED_HASH=$(ZIG_VER="${ZIG_VERSION}" ZIG_ARCH_KEY="${ZIG_ARCH}-linux" ZIG_IDX="${INDEX_FILE}" \
        python3 -c "
    import json, os, sys
    idx = json.load(open(os.environ['ZIG_IDX']))
    pkg = idx.get(os.environ['ZIG_VER'], {}).get(os.environ['ZIG_ARCH_KEY'], {})
    h = pkg.get('shasum', '')
    if not h: sys.exit('SHA-256 not found for ' + os.environ['ZIG_VER'] + '/' + os.environ['ZIG_ARCH_KEY'])
    print(h)
    ")
      rm -f "${INDEX_FILE}"
      curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/${TARBALL}" -o "${TARBALL}"
      echo "${EXPECTED_HASH}  ${TARBALL}" | sha256sum --check --strict
      tar -xJf "${TARBALL}"
      mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      rm -f "${TARBALL}"
    fi
  - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
  - zig version

# Leak-gate post-processor. Operates on the file named in "$LOG".
# Fails the job on any of:
#   - Zig std.testing.allocator leak banner.
#   - Missing "Build Summary" line (test runner aborted).
#   - Any "N failed" count in the summary.
# GAP-0005: applied to all four optimize modes so a leak that only
# surfaces under ReleaseSafe's stricter tripwire or ReleaseFast's
# different allocator layout cannot pass CI silently.
.leak-gate: &leak-gate
  - |
    if [ -z "${LOG:-}" ]; then
      echo "LEAK GATE: LOG env var not set." >&2
      exit 1
    fi
    if grep -qE "(memory leak detected|not freed)" "$LOG"; then
      echo "LEAK GATE: Zig test allocator reported leaked allocations in $LOG." >&2
      exit 1
    fi
    if ! grep -qE "Build Summary: [0-9]+/[0-9]+ steps succeeded;" "$LOG"; then
      echo "LEAK GATE: no Build Summary line in $LOG -- runner aborted early." >&2
      exit 1
    fi
    if grep -qE "[0-9]+ failed" "$LOG"; then
      echo "LEAK GATE: test summary reports failures in $LOG." >&2
      exit 1
    fi

# Override zig-format component to use the project's ZIG_VERSION.
# The v1.2.1 component defaults to 0.14.0 and does not accept a version input.
zig-format:
  before_script:
    - *install-zig

# Build job
build:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check

# Cross-platform build coverage (GAP-0018, GAP-0019).
#
# Zig cross-compiles from the Linux runners, so portability breaks
# (platform-specific std APIs, target-conditional code) are caught at
# compile time without a Windows/macOS runner or emulator. We compile the
# library + CLI binaries (`zig build`) and run semantic analysis
# (`zig build check`) for each target. Running the cross-compiled test
# binaries needs an emulator (Wine / a native runner) and is tracked as a
# follow-up; compilation coverage is the cheap, high-value first step.
build-windows:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check -Dtarget=x86_64-windows
    - zig build -Dtarget=x86_64-windows
  needs:
    - build

build-macos:
  stage: build
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build check -Dtarget=aarch64-macos
    - zig build -Dtarget=aarch64-macos
  needs:
    - build

# Unit tests
#
# Leak gate (Debug): Zig's std.testing.allocator is a
# `GeneralPurposeAllocator` with leak-checking turned on -- any test
# that leaks memory will cause the runner to exit non-zero with a
# diagnostic. We tee the build output to a log and apply the shared
# `.leak-gate` anchor to fail the job on leaks, aborted runs, or
# any reported failures. Debug is the primary leak-check surface.
test:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - set -o pipefail
    - zig build test --summary all 2>&1 | tee test.log
    - LOG=test.log
    - *leak-gate
  artifacts:
    when: always
    paths:
      - test.log
    expire_in: 1 week
  needs:
    - build

# Release optimization tests -- all three release modes now run the
# shared `.leak-gate` post-processor so a leak surfaced only under
# stricter ReleaseSafe tripwires or ReleaseFast's allocator layout
# is not silently masked (GAP-0005 full closure).
test-release-safe:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - set -o pipefail
    - zig build test -Doptimize=ReleaseSafe --summary all 2>&1 | tee test-release-safe.log
    - LOG=test-release-safe.log
    - *leak-gate
  artifacts:
    when: always
    paths:
      - test-release-safe.log
    expire_in: 1 week
  needs:
    - build

# ReleaseFast tests
test-release-fast:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - set -o pipefail
    - zig build test -Doptimize=ReleaseFast --summary all 2>&1 | tee test-release-fast.log
    - LOG=test-release-fast.log
    - *leak-gate
  artifacts:
    when: always
    paths:
      - test-release-fast.log
    expire_in: 1 week
  needs:
    - build

# ReleaseSmall tests
test-release-small:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - set -o pipefail
    - zig build test -Doptimize=ReleaseSmall --summary all 2>&1 | tee test-release-small.log
    - LOG=test-release-small.log
    - *leak-gate
  artifacts:
    when: always
    paths:
      - test-release-small.log
    expire_in: 1 week
  needs:
    - build

# toml-test conformance stage (closes GAP-0004).
#
# Builds the zig-out/bin/toml-test-decoder binary, then runs the pinned
# BurntSushi/toml-test Go harness (github.com/toml-lang/toml-test) against
# the upstream valid+invalid corpus.
#
# ENFORCED gate (allow_failure: false). The decoder targets TOML v1.1.0
# (toml.parse defaults to .v1_1_0), so the harness runs the v1.1.0 corpus
# (`-toml 1.1.0`). At that version the decoder passes the full corpus
# except `valid/key/unicode` (TOML 1.1 Unicode bare keys -- tracked as an
# open feature gap), which is explicitly skipped here. Any other failure
# (a conformance regression) blocks the merge via `set -o pipefail` +
# toml-test's non-zero exit. See
# docs/superpowers/plans/2026-04-18-13-toml-test-ci-differential.md.
conformance-decoder:
  stage: test
  image: golang:1.27-bookworm
  before_script:
    - *install-zig
    - go install github.com/toml-lang/toml-test/cmd/toml-test@${TOML_TEST_VERSION}
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - toml-test -help 2>&1 | head -n 1
  script:
    - zig build --release=safe
    - test -x zig-out/bin/toml-test-decoder
    - set -o pipefail
    # -toml 1.1.0: match the decoder's default parse version.
    # -skip valid/key/unicode: known open gap (TOML 1.1 Unicode bare keys).
    - toml-test -toml 1.1.0 -skip 'valid/key/unicode' ./zig-out/bin/toml-test-decoder 2>&1 | tee conformance.log
    - |
      # Extract the final pass/fail summary line emitted by toml-test.
      # Format: "toml-test [./toml-test-decoder]: using embedded tests: N passed, M failed"
      if ! grep -qE "passed,[[:space:]]+[0-9]+[[:space:]]+failed" conformance.log; then
        echo "CONFORMANCE GATE: no summary line -- runner aborted early." >&2
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - conformance.log
    expire_in: 1 month
  allow_failure: false
  needs:
    - build

# toml-test conformance stage for the encoder direction (closes GAP-0007).
#
# Mirrors conformance-decoder but drives the encoder binary via
# `toml-test -encoder`, which feeds the binary tagged-JSON on stdin
# and expects TOML on stdout. Runs the v1.1.0 corpus to match the
# library's default. ENFORCED (allow_failure: false): the encoder passes
# all 182 verifiable cases. The five `-skip`ped cases are toml-test
# harness limitations -- its own embedded reference decoder cannot parse
# its own TOML-1.1 expected files (no-seconds times, multiline inline
# tables, Unicode keys, `\e`/`\xHH` escapes), reported as "BUG IN TEST
# CASE", not encoder defects.
conformance-encoder:
  stage: test
  image: golang:1.27-bookworm
  before_script:
    - *install-zig
    - go install github.com/toml-lang/toml-test/cmd/toml-test@${TOML_TEST_VERSION}
    - export PATH="$(go env GOPATH)/bin:$PATH"
    - toml-test -help 2>&1 | head -n 1
  script:
    - zig build --release=safe
    - test -x zig-out/bin/toml-test-encoder
    - set -o pipefail
    - >-
      toml-test -toml 1.1.0 -encoder
      -skip 'valid/datetime/no-seconds'
      -skip 'valid/inline-table/newline'
      -skip 'valid/key/unicode'
      -skip 'valid/string/escape-esc'
      -skip 'valid/string/hex-escape'
      ./zig-out/bin/toml-test-encoder 2>&1 | tee conformance-encoder.log
    - |
      if ! grep -qE "passed,[[:space:]]+[0-9]+[[:space:]]+failed" conformance-encoder.log; then
        echo "CONFORMANCE GATE: no summary line -- runner aborted early." >&2
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - conformance-encoder.log
    expire_in: 1 month
  allow_failure: false
  needs:
    - build

# Public-API drift gate.
# Fails the pipeline if the list of `pub const|fn` symbols in
# src/toml.zig disagrees with docs/PUBLIC_API.md. A rename, removal,
# or addition MUST land in the same MR that updates the manifest.
# Closes Q-16.
api-drift:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - apt-get update && apt-get install -y grep coreutils gawk diffutils
  script:
    - set -e
    - |
      grep -nE '^pub (const|fn) ' src/toml.zig \
        | awk '{
            for (i=1; i<=NF; i++) {
              if ($i == "const" || $i == "fn") {
                name = $(i+1);
                sub(/[(=:].*$/, "", name);
                print $i, name;
                break;
              }
            }
          }' \
        | sort -u > /tmp/live_api.txt
    - |
      awk '/^(const|fn) [A-Za-z_][A-Za-z_0-9]*$/' docs/PUBLIC_API.md \
        | sort -u > /tmp/manifest_api.txt
    - |
      if ! diff -u /tmp/manifest_api.txt /tmp/live_api.txt; then
        echo "API-DRIFT: src/toml.zig disagrees with docs/PUBLIC_API.md." >&2
        echo "Update docs/PUBLIC_API.md in the same MR." >&2
        exit 1
      fi
  needs:
    - build

# Coverage floor.
# The repo does not ship with kcov or llvm-cov integration. Until it
# does, guard regressions coarsely: fail the pipeline if the number
# of passing build steps drops below the committed baseline. Bumping
# the floor is a deliberate edit of COVERAGE_TEST_FLOOR (top of file)
# in the same MR that adds tests. Closes Q-16 (coverage leg).
coverage-floor:
  stage: test
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - set -o pipefail
    - zig build test --summary all 2>&1 | tee coverage.log
    - |
      PASSED=$(grep -oE 'Build Summary: [0-9]+/[0-9]+ steps succeeded' coverage.log \
        | head -1 | awk '{ split($3, a, "/"); print a[1] }')
      if [ -z "$PASSED" ]; then
        echo "COVERAGE-FLOOR: no Build Summary line in zig build test output." >&2
        exit 1
      fi
      echo "passed_steps=$PASSED floor=$COVERAGE_TEST_FLOOR"
      if [ "$PASSED" -lt "$COVERAGE_TEST_FLOOR" ]; then
        echo "COVERAGE-FLOOR: $PASSED passed steps < floor $COVERAGE_TEST_FLOOR." >&2
        echo "Either restore coverage or lower COVERAGE_TEST_FLOOR in the same MR." >&2
        exit 1
      fi
  artifacts:
    when: always
    paths:
      - coverage.log
    expire_in: 1 week
  needs:
    - build

# Coverage-guided fuzz testing.
# Runs with a 60-second timeout so the job always terminates.
#
# Exit-code semantics:
#   rc=0  : fuzzer stopped cleanly before timeout (no crash)
#   rc=124: timeout reached (expected in CI) - pass
#   other : fuzzer found a crash - fail the job
fuzz:
  stage: fuzz
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - timeout 60 zig build test --fuzz; rc=$?; if [ $rc -ne 0 ] && [ $rc -ne 124 ]; then exit $rc; fi
  artifacts:
    when: on_failure
    paths:
      - zig-out/fuzz/
    expire_in: 1 week
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
  allow_failure: true
  needs:
    - build

# Microbenchmark harness (GAP-0011).
# allow_failure: true -- benchmarks publish results only; they do not
# gate merges yet. A follow-up will add regression thresholds (see
# docs/PERFORMANCE.md).
bench:
  stage: bench
  image: debian:bookworm-slim
  before_script:
    - *install-zig
  script:
    - zig build bench-all -Doptimize=ReleaseFast 2>bench.stderr | tee bench.csv
  artifacts:
    when: always
    paths:
      - bench.csv
      - bench.stderr
    expire_in: 4 weeks
  allow_failure: true
  needs:
    - build

# SONNY-4778: tools must not redirect Git operations into this worktree.
hook-env-regression:
  stage: lint
  image: python:3.14-slim-bookworm
  tags: [company, linux, x86]
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
  script:
    - python3 scripts/test_hook_env.py
